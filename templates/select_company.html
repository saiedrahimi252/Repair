<!DOCTYPE html><html lang="fa" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>انتخاب شرکت</title><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.rtl.min.css"><link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css"><style>body{font-family:Vazirmatn,Tahoma,sans-serif;background:#f5f6f8;min-height:100vh;display:flex;align-items:center}</style></head><body><div class="container" style="max-width:520px"><div class="card shadow-sm"><div class="card-body p-4"><h3 class="text-center">سیستم مدیریت تعمیرات</h3><p class="text-muted text-center">ابتدا شرکت خود را انتخاب کنید</p>{% with messages=get_flashed_messages(with_categories=true) %}{% for category,message in messages %}<div class="alert alert-{{ 'danger' if category=='error' else category }}">{{ message }}</div>{% endfor %}{% endwith %}<form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><select name="company_id" class="form-select form-select-lg mb-3" required><option value="">انتخاب شرکت...</option>{% for c in companies %}<option value="{{ c.id }}">{{ c.name }}</option>{% endfor %}</select><button class="btn btn-primary w-100">ادامه</button></form><hr><a class="btn btn-outline-secondary w-100" href="{{ url_for('master_login') }}">ورود مدیر اصلی</a></div></div></div></body></html>
