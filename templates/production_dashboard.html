{% extends "base.html" %}
{% block content %}
<div class="container py-3">
  <h2>ماژول تولید</h2>
  <p>فاز ۱ — اطلاعات پایه و برنامه‌ریزی تولید</p>
  <div class="row g-3">
    <div class="col-md-4"><a class="card p-3 text-decoration-none" href="{{ url_for('production.products') }}"><b>محصولات</b><span>{{ counts.products }}</span></a></div>
    <div class="col-md-4"><a class="card p-3 text-decoration-none" href="{{ url_for('production.stations') }}"><b>ایستگاه‌ها</b><span>{{ counts.stations }}</span></a></div>
    <div class="col-md-4"><div class="card p-3"><b>ماشین‌ها</b><span>{{ counts.machines }}</span></div></div>
    <div class="col-md-4"><div class="card p-3"><b>پرسنل</b><span>{{ counts.employees }}</span></div></div>
    <div class="col-md-4"><div class="card p-3"><b>شیفت‌ها</b><span>{{ counts.shifts }}</span></div></div>
    <div class="col-md-4"><div class="card p-3"><b>برنامه‌ها</b><span>{{ counts.plans }}</span></div></div>
  </div>
</div>
{% endblock %}
