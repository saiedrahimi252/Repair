<!DOCTYPE html><html lang="fa" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>ورود مدیر اصلی</title><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.rtl.min.css"><link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css"></head><body class="bg-light"><div class="container" style="max-width:420px;margin-top:10vh"><div class="card shadow-sm"><div class="card-body p-4"><h3 class="text-center">ورود مدیر اصلی</h3>{% with messages=get_flashed_messages(with_categories=true) %}{% for category,message in messages %}<div class="alert alert-{{ 'danger' if category=='error' else category }}">{{ message }}</div>{% endfor %}{% endwith %}<form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><input class="form-control mb-3" name="username" placeholder="نام کاربری" required><input class="form-control mb-3" type="password" name="password" placeholder="رمز عبور" required><button class="btn btn-primary w-100">ورود</button></form><div class="text-center mt-3"><a href="{{ url_for('select_company') }}">بازگشت به انتخاب شرکت</a></div></div></div></div></body></html>
