<!DOCTYPE html><html lang="fa" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>ساخت مدیر اصلی</title><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.rtl.min.css"><link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css"></head><body class="bg-light"><div class="container" style="max-width:480px;margin-top:8vh"><div class="card shadow-sm"><div class="card-body p-4"><h3 class="text-center">ساخت مدیر اصلی</h3><p class="text-muted">این حساب فقط برای مدیریت شرکت‌ها و پلن‌هاست.</p>{% with messages=get_flashed_messages(with_categories=true) %}{% for category,message in messages %}<div class="alert alert-{{ 'danger' if category=='error' else category }}">{{ message }}</div>{% endfor %}{% endwith %}<form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><input class="form-control mb-3" name="full_name" placeholder="نام و نام خانوادگی"><input class="form-control mb-3" name="username" placeholder="نام کاربری" required><input class="form-control mb-3" type="password" name="password" placeholder="رمز عبور حداقل ۸ کاراکتر" required minlength="8"><input class="form-control mb-3" type="password" name="password2" placeholder="تکرار رمز عبور" required minlength="8"><button class="btn btn-primary w-100">ساخت مدیر اصلی</button></form></div></div></div></body></html>
