<!DOCTYPE html>
<html lang="fa" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>ورود</title><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.rtl.min.css"><link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css">
<style>body{font-family:Vazirmatn,Tahoma,sans-serif;background:#f5f6f8;min-height:100vh;display:flex;align-items:center}</style></head>
<body><div class="container" style="max-width:420px"><div class="card shadow-sm"><div class="card-body p-4">
<h4 class="text-center mb-1">{{ company_name }}</h4><p class="text-muted text-center mb-4">سیستم مدیریت تعمیرات — ورود</p>
{% with messages=get_flashed_messages(with_categories=true) %}{% for category,message in messages %}<div class="alert alert-{{ 'danger' if category=='error' else category }}">{{ message }}</div>{% endfor %}{% endwith %}
<form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
<div class="mb-3"><label class="form-label">نام کاربری</label><input type="text" name="username" class="form-control" required autofocus></div>
<div class="mb-3"><label class="form-label">رمز عبور</label><input type="password" name="password" class="form-control" required></div>
<button class="btn btn-primary w-100">ورود</button></form>
<div class="text-center mt-3"><a href="{{ url_for('select_company') }}">تغییر شرکت</a></div>
</div></div></div></body></html>
